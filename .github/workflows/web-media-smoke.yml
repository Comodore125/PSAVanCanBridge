name: Web media smoke checks
on:
  push:
    branches: [feature/3.9.2-wifi-steering-media, feat/3.9.2-spotify-hold-seek]
  pull_request:
    paths:
      - "data/media.html"
      - "scripts/**"
      - "sdkconfig.esp32c6"
      - "data/telecoding.html"
      - "tests/telecoding-asset-smoke.cjs"
      - "src/Helpers/WebServer/WebServer.hpp"
      - "src/Protocol/AEE2001/Handlers/BSI/MessageHandler_9C4.hpp"
      - "src/Helpers/CarState.hpp"
      - "src/Helpers/SpotifySeekGesture.hpp"
      - "src/Helpers/SpotifyBridge.hpp"
      - "src/Protocol/AEE2001/Handlers/BSI/MessageHandler_9C4.hpp"
      - "tests/spotify-seek-gesture-smoke.cpp"
      - "tests/web-media-smoke.cjs"
      - ".github/workflows/web-media-smoke.yml"
  workflow_dispatch:

jobs:
  browser-and-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Offline media page smoke checks
        run: node tests/web-media-smoke.cjs
      - name: Validate optimized telecoding JavaScript
        run: node tests/telecoding-asset-smoke.cjs
      - name: Validate RD45 source and Spotify seek gestures (host C++17)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc tests/radio-audio-source-smoke.cpp -o /tmp/radio-source-test
          /tmp/radio-source-test
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc tests/spotify-seek-gesture-smoke.cpp -o /tmp/spotify-gesture-test
          /tmp/spotify-gesture-test
      - name: Check media HTML extraction
        run: |
          test -s data/media.html
          grep -q "</html>" data/media.html

  firmware-c6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep PlatformIO packages outside checkout
        run: echo "PLATFORMIO_CORE_DIR=$RUNNER_TEMP/platformio" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build matching ESP32-C6 firmware
        run: pio run --environment esp32c6_v16
      - name: Verify full Newlib formatting is enabled
        run: |
          grep -E "^(# CONFIG_LIBC_NEWLIB_NANO_FORMAT is not set|CONFIG_LIBC_NEWLIB_NANO_FORMAT=n)$" .pio/build/esp32c6_v16/sdkconfig
      - name: Upload experimental firmware for bench validation
        uses: actions/upload-artifact@v4
        with:
          name: experimental-392-media-esp32c6-v16
          path: .pio/build/esp32c6_v16/firmware.bin
          if-no-files-found: error
          retention-days: 7
