<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSA VAN-CAN Bridge - Network Monitor</title>
<link rel="stylesheet" href="styles.css">
</head>

<body class="monitor-page">

<header>

    <input
        id="wsUrl"
        class="form-control font-monospace monitor-control monitor-input"
        size="40"
        value="ws://192.168.100.1/ws"
    >

    <select
        id="networkSelect"
        class="form-select monitor-control monitor-select"
        onchange="changeNetworkAndDirection()"
    >
        <option value="0">None</option>
        <option value="1">Source</option>
        <option value="2">Destination</option>
    </select>

    <select
        id="directionSelect"
        class="form-select monitor-control monitor-select"
        onchange="changeNetworkAndDirection()"
    >
        <option value="0">None</option>
        <option value="1">Incoming</option>
        <option value="2">Outgoing</option>
    </select>

    <input
        id="idFilter"
        class="form-control font-monospace monitor-control monitor-input monitor-filter"
        placeholder="ID filter: 0B6 0E6 0F6 ..."
        title="Space or comma-separated hex IDs to show. Empty = show all."
    >

    <button class="btn btn-success monitor-button" onclick="connectWs()">
        Connect
    </button>

    <button class="btn btn-secondary monitor-button" onclick="disconnectWs()">
        Disconnect
    </button>

    <button class="btn btn-primary monitor-button" onclick="clearData()">
        Clear
    </button>

    <button class="btn btn-warning monitor-button" onclick="saveLog()">
        Save
    </button>

    <div id="status">
        Disconnected
    </div>

</header>

<section id="rd45Probe" style="margin:12px;padding:14px;border:1px solid #697d91;border-radius:12px;background:#142231;color:#f0f5fc;font:14px system-ui">
  <strong>RD45 physical-button CAN probe (read-only)</strong>
  <p style="margin:6px 0">Use Destination / Incoming and leave ID filter empty. Capture idle traffic, then press NEXT or PREVIOUS on the radio while capturing. This compares bus traffic, not proof of its source.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button id="probeIdle" type="button">1. Capture idle</button>
    <button id="probePress" type="button">2. Capture button</button>
    <button id="probeAnalyze" type="button">3. Compare</button>
    <button id="probeReset" type="button">Reset probe</button>
    <button id="probeExport" type="button">Export comparison</button>
  </div>
  <p id="probeStatus" role="status" style="margin:8px 0">Not recording.</p>
  <div id="probeResults" style="overflow-x:auto;white-space:pre-wrap;font:12px ui-monospace,monospace"></div>
</section>

<div id="container">

    <!-- DESKTOP -->

    <div class="desktop">

        <div
            class="desktop-row desktop-header"
        >

            <div class="desktop-cell">
                Time
            </div>

            <div class="desktop-cell">
                Count
            </div>

            <div class="desktop-cell">
                ID
            </div>

            <div class="desktop-cell">
                DLC
            </div>

            <div class="desktop-cell">
                Data
            </div>

            <div class="desktop-cell">
                ASCII
            </div>

        </div>

        <div id="desktopRows"></div>

    </div>

    <!-- MOBILE -->

    <div
        class="mobile"
        id="cardContainer"
    ></div>

</div>

<script>

/* ================= CONFIG ================= */

const CONFIG = {
    byteGroupSize: 4,
    maxLogLines: 50000,
    frameTimeoutMs: 30000,
    maxFramesPerRender: 500
};

/* ================= STATE ================= */

let ws = null;
let monitorRequest = Promise.resolve();

let protocolConfigPromise = Promise.resolve({});

const frames = new Map();

const log = [];

const pendingFrames = [];
let renderErrorReported = false;

const desktopRows =
    document.getElementById("desktopRows");

const cardContainer =
    document.getElementById("cardContainer");

/* ================= WEBSOCKET ================= */

function getSelectedNetwork() {
    const networkSelect =
        document.getElementById("networkSelect");
    return parseInt(networkSelect.value);
}

function getSelectedDirection() {
    const directionSelect =
        document.getElementById("directionSelect");
    return parseInt(directionSelect.value);
}

async function changeNetworkAndDirection() {

    const network = getSelectedNetwork();
    const direction = getSelectedDirection();
    const networkName = document.getElementById("networkSelect").selectedOptions[0].text;
    const directionName = document.getElementById("directionSelect").selectedOptions[0].text;
    const selection = `Network: ${networkName} (${network})\nDirection: ${directionName} (${direction})`;

    try {
        await setNetworkAndDirection(network, direction);
    }
    catch (error) {
        setStatus("Monitor setup failed", "#ff9800");
        console.error(error);
        alert(`${selection}\nMonitor request failed: ${error.message}`);
    }
}

function setNetworkAndDirection(network, direction) {
    const apiUrl = new URL(document.getElementById("wsUrl").value);
    apiUrl.protocol = apiUrl.protocol === "wss:" ? "https:" : "http:";
    apiUrl.pathname = "/api/setmonitor";
    apiUrl.search = "";
    apiUrl.hash = "";

    // Apply selections in order, even when the user changes them quickly.
    monitorRequest = monitorRequest.catch(() => {}).then(async () => {
        const response = await fetch(
            apiUrl.href,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    network,
                    direction
                })
            },
        );
        const body = await response.text();
        if (!response.ok) {
            throw new Error(`${apiUrl.href}\nHTTP status: ${response.status}\nResponse: ${body}`);
        }
        return { url: apiUrl.href, status: response.status, body };
    });
    return monitorRequest;
}

function connectWs() {
    if (ws) ws.close();

    const socket = new WebSocket(
        document.getElementById("wsUrl").value
    );
    ws = socket;

    socket.onopen = async () => {
        if (ws !== socket) return;
        setStatus(
            "Connected",
            "#4caf50"
        );
        try {
            await setNetworkAndDirection(getSelectedNetwork(), getSelectedDirection());
        }
        catch (error) {
            if (ws === socket) setStatus("Monitor setup failed", "#ff9800");
            console.error(error);
        }
    };

    socket.onclose = () => {
        if (ws !== socket) return;
        ws = null;
        setStatus(
            "Disconnected",
            "#f44336"
        );
    };

    socket.onerror = () => {
        if (ws !== socket) return;
        setStatus(
            "Error",
            "#ff9800"
        );
    };

    socket.onmessage = (e) => {
        if (ws !== socket) return;
        pendingFrames.push(
            e.data
        );
    };
}

function disconnectWs() {
    setNetworkAndDirection(0, 0).catch(error => console.error(error));

    if (ws)
        ws.close();

    ws = null;
    setStatus("Disconnected", "#f44336");
}

function setStatus(text, color) {
    const el =
        document.getElementById("status");

    el.textContent = text;
    el.style.color = color;
}

/* ================= FRAME QUEUE ================= */

function processPendingFrames() {
    let processed = 0;

    while (
        pendingFrames.length &&
        processed < CONFIG.maxFramesPerRender
    ) {
        const raw = pendingFrames.shift();
        try {
            handleFrame(raw);
        }
        catch (error) {
            console.error("Monitor render failed", error, raw);
            if (!renderErrorReported) {
                renderErrorReported = true;
                alert(`Monitor render failed: ${error.message}\nPacket: ${String(raw).slice(0, 500)}`);
            }
        }
        processed++;
    }

    requestAnimationFrame(
        processPendingFrames
    );
}

requestAnimationFrame(
    processPendingFrames
);

/* ================= ID FILTER ================= */

function getFilterIds() {
    const raw = document.getElementById("idFilter").value.trim();
    if (!raw) return new Set();
    return new Set(
        raw.split(/[\s,]+/).filter(Boolean).map(s => s.toUpperCase())
    );
}

/* ================= PARSE ================= */

function parse(raw) {
    try {

        return JSON.parse(raw);
    }
    catch {
        const p =
            raw.trim().split(/\s+/);

        return {
            id: p[0],
            data: p.slice(1)
        };
    }
}

/* ================= ASCII ================= */

function buildAscii(data) {

    let ascii = "";

    for (const v of data) {

        const b =
            parseInt(v, 16);

        ascii += (
            b >= 32 &&
            b <= 126
        )
            ? String.fromCharCode(b)
            : ".";
    }

    return ascii;
}

/* ================= HANDLE FRAME ================= */

function handleFrame(raw) {

    const frame = parse(raw);

    if (!frame?.id)
        return;

    const id =
        frame.id.toUpperCase();

    const filter = getFilterIds();
    if (filter.size > 0 && !filter.has(id))
        return;

    const data =
        frame.data || [];

    rd45Probe.record(id, data);

    const d = new Date();

    const ts =
        d.getHours().toString().padStart(2, '0')
        + ":" +
        d.getMinutes().toString().padStart(2, '0')
        + ":" +
        d.getSeconds().toString().padStart(2, '0')
        + "." +
        d.getMilliseconds().toString().padStart(3, '0');

    /* ===== LOG ===== */

    log.push(
        `[${ts}] ${id} ${data.join(" ")}`
    );

    if (
        log.length >
        CONFIG.maxLogLines
    ) {

        log.splice(0, 1000);
    }

    /* ===== STATE ===== */

    let state =
        frames.get(id);

    if (!state) {

        state = {

            count: 0,

            last: [],

            lastSeen: Date.now()
        };

        frames.set(id, state);

        createDesktopRow(id);

        createMobileCard(id);
    }

    state.count++;

    state.lastSeen = Date.now();

    updateDesktopRow(
        id,
        ts,
        state.count,
        data,
        state.last
    );

    updateMobileCard(
        id,
        ts,
        state.count,
        data,
        state.last
    );

    state.last = [...data];
}


/* RD45 probe: bounded, receive-only browser analysis. No ECU TX or monitor changes. */
const rd45Probe = (() => {
    const MAX_SAMPLES = 25000;
    const capture = { idle: new Map(), press: new Map() };
    let mode = null, samples = 0, lastReport = "";
    const el = id => document.getElementById(id);
    function status(s) { el("probeStatus").textContent = s; }
    function record(id, data) {
        if (!mode || samples >= MAX_SAMPLES) return;
        const normalized = String(id).toUpperCase().replace(/^0X/, "");
        const bytes = (Array.isArray(data) ? data : []).map(b => String(b).toUpperCase().padStart(2, "0"));
        if (!/^[0-9A-F]{1,8}$/.test(normalized) || bytes.some(b => !/^[0-9A-F]{2}$/.test(b))) return;
        const bucket = capture[mode];
        if (!bucket.has(normalized)) bucket.set(normalized, { count: 0, samples: [], signatures: new Map() });
        const entry = bucket.get(normalized);
        entry.count++;
        const signature = bytes.join(" ");
        entry.signatures.set(signature, (entry.signatures.get(signature) || 0) + 1);
        if (entry.samples.length < 12) entry.samples.push(signature);
        samples++;
        if (samples === MAX_SAMPLES) status("Sample limit reached. Click Compare.");
    }
    function start(next) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            status("Connect WebSocket first; select Destination / Incoming.");
            return;
        }
        if (getSelectedNetwork() !== 2 || getSelectedDirection() !== 1 || getFilterIds().size) {
            status("Select Destination / Incoming and clear ID filter.");
            return;
        }
        capture[next].clear();
        samples = 0;
        mode = next;
        status("Capturing " + next + " until you click Compare or start another capture (max " + MAX_SAMPLES + " frames).");
    }
    function compare() {
        mode = null;
        const idle = capture.idle, press = capture.press;
        const ids = [...new Set([...idle.keys(), ...press.keys()])];
        const rows = ids.map(id => {
            const a = idle.get(id), b = press.get(id);
            const aS = a?.signatures || new Map(), bS = b?.signatures || new Map();
            const added = [...bS].filter(([s]) => !aS.has(s)).map(([s,n]) => ({ data:s, count:n }));
            const removed = [...aS].filter(([s]) => !bS.has(s)).map(([s,n]) => ({ data:s, count:n }));
            return { id, idleFrames:a?.count||0, pressFrames:b?.count||0, added, removed,
                score:added.reduce((n,x)=>n+x.count,0) };
        }).filter(x=>x.score || (x.idleFrames === 0 && x.pressFrames > 0))
          .sort((a,b)=>b.score-a.score || a.id.localeCompare(b.id));
        const header = "CAN ID | idle | button | novel frames | sample novel payloads";
        const lines = rows.slice(0,120).map(x => x.id+" | "+x.idleFrames+" | "+x.pressFrames+
            " | "+x.score+" | "+x.added.slice(0,4).map(s=>s.data+" ("+s.count+")").join("; "));
        lastReport = [header,...lines].join("\n");
        el("probeResults").textContent = lastReport || "No observable frame differences.";
        status("Compared "+ids.length+" IDs; "+rows.length+" candidate IDs. Different traffic can be unrelated to buttons. Repeat each test, preferably with no other user interactions.");
    }
    function reset() {
        mode = null; samples = 0; lastReport = "";
        capture.idle.clear(); capture.press.clear();
        el("probeResults").textContent = "";
        status("Probe cleared.");
    }
    function exportReport() {
        const blob = new Blob([lastReport || "No comparison yet."], { type:"text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href=url; a.download="RD45_button_CAN_comparison.txt"; a.click();
        setTimeout(()=>URL.revokeObjectURL(url),1000);
    }
    el("probeIdle").addEventListener("click",()=>start("idle"));
    el("probePress").addEventListener("click",()=>start("press"));
    el("probeAnalyze").addEventListener("click",compare);
    el("probeReset").addEventListener("click",reset);
    el("probeExport").addEventListener("click",exportReport);
    return { record };
})();

/* ================= DESKTOP ================= */

function createDesktopRow(id) {

    const row =
        document.createElement("div");

    row.className =
        "desktop-row";

    row.id =
        "row-" + id;

    row.innerHTML = `
        <div class="desktop-cell timestamp"></div>

        <div class="desktop-cell counter"></div>

        <div class="desktop-cell id-cell">
            ${id}
        </div>

        <div class="desktop-cell dlc"></div>

        <div class="desktop-cell">
            <div class="byte-container"></div>
        </div>

        <div class="desktop-cell ascii"></div>
    `;

    desktopRows.appendChild(row);
}

function updateDesktopRow(
    id,
    ts,
    count,
    data,
    old
) {

    const row =
        document.getElementById("row-" + id);

    if (!row)
        return;

    const cells =
        row.children;

    cells[0].textContent = ts;
    cells[1].textContent = count;
    cells[3].textContent = data.length;

    const byteContainer =
        row.querySelector(".byte-container");

    /* ===== CREATE GROUPS DYNAMICALLY ===== */

    while (
        byteContainer.children.length <
        Math.ceil(
            data.length /
            CONFIG.byteGroupSize
        )
    ) {

        const group =
            document.createElement("div");

        group.className =
            "byte-group";

        for (
            let i = 0;
            i < CONFIG.byteGroupSize;
            i++
        ) {

            const b =
                document.createElement("div");

            b.className =
                "byte";

            b.textContent = "--";

            group.appendChild(b);
        }

        byteContainer.appendChild(group);
    }

    /* ===== UPDATE BYTES ===== */

    const byteEls =
        row.querySelectorAll(".byte");

    for (
        let i = 0;
        i < data.length;
        i++
    ) {

        const el =
            byteEls[i];

        const v =
            data[i];

        if (
            el.textContent !== v
        ) {

            el.textContent = v;

            if (
                old[i] !== undefined &&
                old[i] !== v
            ) {

                el.classList.remove(
                    "changed"
                );

                void el.offsetWidth;

                el.classList.add(
                    "changed"
                );
            }
        }
    }

    /* ===== CLEAR UNUSED BYTES ===== */

    for (
        let i = data.length;
        i < byteEls.length;
        i++
    ) {

        byteEls[i].textContent = "--";
    }

    cells[5].textContent =
        buildAscii(data);
}

/* ================= MOBILE ================= */

function createMobileCard(id) {

    const card =
        document.createElement("div");

    card.className =
        "card";

    card.id =
        "card-" + id;

    card.innerHTML = `
        <div class="card-header">
            <span>${id}</span>
            <div class="card-meta"></div>
            <span class="card-count">
                0
            </span>
        </div>
        <div class="byte-row"></div>
        <div class="ascii-row"></div>
    `;

    cardContainer.appendChild(card);
}

function updateMobileCard(
    id,
    ts,
    count,
    data,
    old
) {

    const card =
        document.getElementById("card-" + id);

    if (!card)
        return;

    card.querySelector(
        ".card-count"
    ).textContent = count;

    card.querySelector(
        ".card-meta"
    ).textContent =
        `${ts} | LEN ${data.length}`;

    const byteRow =
        card.querySelector(".byte-row");

    /* ===== CREATE GROUPS ===== */

    while (
        byteRow.children.length <
        Math.ceil(
            data.length /
            CONFIG.byteGroupSize
        )
    ) {

        const group =
            document.createElement("div");

        group.className =
            "card-byte-group";

        for (
            let i = 0;
            i < CONFIG.byteGroupSize;
            i++
        ) {

            const b =
                document.createElement("div");

            b.className =
                "byte";

            b.textContent = "--";

            group.appendChild(b);
        }

        byteRow.appendChild(group);
    }

    const byteEls =
        byteRow.querySelectorAll(".byte");

    for (
        let i = 0;
        i < data.length;
        i++
    ) {

        const el =
            byteEls[i];

        const v =
            data[i];

        if (
            el.textContent !== v
        ) {

            el.textContent = v;

            if (
                old[i] !== undefined &&
                old[i] !== v
            ) {

                el.classList.remove(
                    "changed"
                );

                void el.offsetWidth;

                el.classList.add(
                    "changed"
                );
            }
        }
    }

    for (
        let i = data.length;
        i < byteEls.length;
        i++
    ) {

        byteEls[i].textContent = "--";
    }

    card.querySelector(
        ".ascii-row"
    ).textContent =
        buildAscii(data);
}

/* ================= CLEANUP ================= */

setInterval(() => {
    const now =
        Date.now();

    for (
        const [id, state]
        of frames
    ) {
        if (
            now - state.lastSeen >
            CONFIG.frameTimeoutMs
        ) {
            document
                .getElementById("row-" + id)
                ?.remove();
            document
                .getElementById("card-" + id)
                ?.remove();
            frames.delete(id);
        }
    }

}, 5000);

/* ================= UTIL ================= */

function clearData() {
    frames.clear();
    desktopRows.innerHTML = "";
    cardContainer.innerHTML = "";
    log.length = 0;
    pendingFrames.length = 0;
}

function getLogFilename(config, network, direction, date = new Date()) {
    const protocolNames = {
        1: "AEE2001",
        2: "AEE2004",
        3: "AEE2010"
    };
    const protocol = network === 1
        ? config.SOURCE_PROTOCOL
        : network === 2 ? config.DESTINATION_PROTOCOL : undefined;
    const protocolName = protocolNames[protocol] || "unknown";
    const networkName = network === 1 ? "src" : network === 2 ? "dest" : "none";
    const directionName = direction === 1 ? "in" : direction === 2 ? "out" : "none";
    const timestamp = [
        date.getFullYear(),
        date.getMonth() + 1,
        date.getDate(),
        date.getHours(),
        date.getMinutes(),
        date.getSeconds()
    ].map(value => String(value).padStart(2, "0")).join("_");

    return `${protocolName}_${networkName}_${directionName}_${timestamp}.txt`;
}

async function saveLog() {

    const network = getSelectedNetwork();
    const direction = getSelectedDirection();
    const config = await protocolConfigPromise;

    const blob =
        new Blob(
            [log.join("\n")],
            {
                type:
                    "text/plain"
            }
        );

    const a =
        document.createElement("a");

    a.href =
        URL.createObjectURL(blob);

    a.download =
        getLogFilename(config, network, direction);

    a.click();

    URL.revokeObjectURL(a.href);
}

document.addEventListener(
    "DOMContentLoaded",
    () => {
        protocolConfigPromise = fetch("api/config.json")
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Config request failed: ${response.status}`);
                }
                return response.json();
            })
            .catch(error => {
                console.error("Could not load monitor protocol configuration", error);
                return {};
            });

        var wsUrlInput = document.getElementById("wsUrl");
        wsUrlInput.value = "ws://" + window.location.host + "/ws";

        let filterDebounce = null;
        document.getElementById("idFilter").addEventListener("input", () => {
            clearTimeout(filterDebounce);
            filterDebounce = setTimeout(clearData, 400);
        });
    }
);

</script>

</body>
</html>
